<!doctype html>
<html lang="hi" class="js-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">
  <meta name="description" content="ग्राम पंचायत अनूपशहर के वार्डों की ज़रूरतें — ग्रामवासियों से बातचीत के आधार पर।">
  <title data-i18n="title.villageIssues">गाँव की ज़रूरतें | मनोज कुमार आचार्य</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=optional" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=optional"></noscript>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preload" href="js/i18n.js?v=danaram" as="script">
  <link rel="preload" href="js/app.js?v=danaram" as="script">
  <script>
    (function(){try{var d=document.documentElement,l=localStorage.getItem('lang');if(l==='en')d.lang='en';if(localStorage.getItem('largeText')==='1')d.classList.add('large-text');if(localStorage.getItem('contrast')==='1')d.classList.add('hc');}catch(e){}})();
  </script>
</head>
<body data-page="village-issues.html" data-title="villageIssues">
  <a class="skip" href="#main" data-i18n="common.skip">मुख्य जानकारी पर जाएँ</a>
  <div data-chrome="header"></div>

  <main id="main" class="wrap zone-candidate">
    <p class="zone-label candidate" data-i18n="common.labelCandidate">प्रत्याशी का संदेश / Candidate's message</p>

    <h1 data-i18n="issues.h1">गाँव की ज़रूरतें — वार्ड के अनुसार</h1>
    <p class="lead" data-i18n="issues.intro">ग्राम पंचायत अनूपशहर के विभिन्न वार्डों में ग्रामवासियों से बातचीत में सामने आई प्रमुख ज़रूरतें। कोई ज़रूरत छूट गई हो तो हमें ज़रूर बताएँ।</p>

    <div id="issue-list"></div>

    <section class="card" aria-labelledby="add-issue-heading">
      <h2 id="add-issue-heading" data-i18n="issues.add">अपनी ज़रूरत बताएँ</h2>
      <p>
        <a class="btn btn-primary btn-lg" href="ask.html">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-edit"></use></svg>
          <span data-i18n="issues.add">अपनी ज़रूरत बताएँ</span>
        </a>
      </p>
    </section>
  </main>

  <div data-chrome="footer"></div>
  <script src="js/i18n.js?v=danaram"></script>
  <script src="js/app.js?v=danaram"></script>
