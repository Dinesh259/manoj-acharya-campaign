<!doctype html>
<html lang="hi" class="js-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">
  <meta name="description" content="मनोज कुमार आचार्य के समर्थन में गाँववासियों के प्रेरक संदेश, शुभकामनाएँ व तस्वीरें — सर्व समाज जन समर्थन दीवार।">
  <title data-i18n="title.supportWall">जन समर्थन दीवार | मनोज कुमार आचार्य</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=optional" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=optional"></noscript>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preload" href="js/i18n.js?v=danaram" as="script">
  <link rel="preload" href="js/app.js?v=danaram" as="script">
  <script>
    (function(){try{var d=document.documentElement,l=localStorage.getItem('lang');if(l==='en')d.lang='en';if(localStorage.getItem('largeText')==='1')d.classList.add('large-text');if(localStorage.getItem('contrast')==='1')d.classList.add('hc');}catch(e){}})();
  </script>
</head>
<body data-page="support-wall.html" data-title="supportWall">
  <a class="skip" href="#main" data-i18n="common.skip">मुख्य जानकारी पर जाएँ</a>
  <div data-chrome="header"></div>

  <main id="main" class="wrap fb-feed-wrap">
    <!-- Facebook Style "Create Post" Trigger Card -->
    <div class="fb-create-trigger-card" id="fbCreateTriggerCard">
      <div class="fb-trigger-avatar" aria-hidden="true">👤</div>
      <button type="button" class="fb-trigger-fake-input" id="btnTriggerCreatePost" aria-label="पोस्ट लिखें">
        <span class="fb-trigger-placeholder" data-i18n="wall.triggerPlaceholder">मनोज जी के समर्थन में अपने विचार लिखें...</span>
      </button>
      <button type="button" class="btn btn-primary fb-trigger-action-btn" id="btnTriggerCreatePost2">
        <span aria-hidden="true">✍️</span> <span data-i18n="wall.createPostBtn">पोस्ट लिखें</span>
      </button>
    </div>

    <!-- Facebook Style "Create Post" Composer Card (Hidden by default; opens when Create Post is clicked) -->
    <section class="card fb-composer-card" id="postSupportSection" aria-label="Create Post" hidden>
      <div class="fb-composer-head">
        <div class="fb-composer-head-left">
          <span class="fb-composer-avatar" aria-hidden="true">✍️</span>
          <h2 class="fb-composer-title" data-i18n="wall.formHeading">पोस्ट लिखें</h2>
        </div>
        <button type="button" class="fb-composer-close-btn" id="btnCloseComposer" aria-label="बंद करें" title="बंद करें">✕</button>
      </div>

      <!-- Composer Identity Notice -->
      <div class="composer-id-notice">
        <span class="composer-id-badge">🆔 <span data-i18n="wall.publicIdNotice">आपकी पब्लिक आईडी</span>: <strong id="composerUniqueIdVal">ANP-....</strong></span>
      </div>

      <form id="supportForm" novalidate class="fb-composer-form">
        <input type="hidden" id="wallUserId" name="userId" value="">
        <div class="fb-composer-inputs-row">
          <div class="fb-input-author-wrap">
            <span class="fb-author-icon" aria-hidden="true">👤</span>
            <input id="wallName" name="name" type="text" autocomplete="name" required
                   data-i18n-attr="placeholder:wall.namePlaceholder"
                   placeholder="आपका नाम लिखें (Your Name)..." class="fb-author-input">
          </div>
          <div class="fb-select-ward-wrap">
            <select id="wallWard" name="ward" class="fb-ward-select" aria-label="वार्ड चुनें">
              <option value="" data-i18n="wall.selectWard">📍 वार्ड चुनें (वार्ड 1 से 11)</option>
              <option value="वार्ड 1">वार्ड नं. 1</option>
              <option value="वार्ड 2">वार्ड नं. 2</option>
              <option value="वार्ड 3">वार्ड नं. 3</option>
              <option value="वार्ड 4">वार्ड नं. 4</option>
              <option value="वार्ड 5">वार्ड नं. 5</option>
              <option value="वार्ड 6">वार्ड नं. 6</option>
              <option value="वार्ड 7">वार्ड नं. 7</option>
              <option value="वार्ड 8">वार्ड नं. 8</option>
              <option value="वार्ड 9">वार्ड नं. 9</option>
              <option value="वार्ड 10">वार्ड नं. 10</option>
              <option value="वार्ड 11">वार्ड नं. 11</option>
            </select>
          </div>
        </div>

        <div class="fb-composer-textarea-wrap">
          <textarea id="wallMessage" name="message" rows="3" required
                    data-i18n-attr="placeholder:wall.messagePlaceholder"
                    placeholder="मनोज जी के समर्थन में अपने विचार लिखें... (What's on your mind?)"></textarea>
          
          <!-- Selected Photo Preview -->
          <div id="wallPhotoPreviewWrap" class="photo-preview-wrap" hidden style="display:none">
            <img id="wallPhotoPreview" alt="Selected preview">
            <button type="button" class="btn-remove-photo" id="btnRemovePhoto" data-i18n-attr="aria-label:wall.removePhoto;title:wall.removePhoto">✕</button>
          </div>
        </div>

        <p class="form-error" role="alert" hidden></p>
        <p class="form-status" aria-live="polite"></p>

        <div class="fb-composer-actions-bar">
          <div class="fb-composer-left-actions">
            <input type="file" id="wallPhotoInput" accept="image/*" style="display:none" aria-hidden="true">
            <button type="button" class="fb-attach-photo-btn" id="btnPickPhoto">
              <span class="fb-attach-icon" aria-hidden="true">📷</span>
              <span data-i18n="wall.photoAttach">फ़ोटो जोड़ें</span>
            </button>
          </div>
          <div class="fb-composer-right-actions">
            <button type="button" class="btn btn-outline fb-cancel-btn" id="btnCancelComposer">रद्द करें</button>
            <button type="submit" class="btn btn-primary fb-submit-post-btn" id="btnSubmitSupport">
              <span aria-hidden="true">✍️</span> <span data-i18n="wall.publishPost">पोस्ट करें</span>
            </button>
          </div>
        </div>
      </form>
    </section>

    <!-- Support Feed Stream -->
    <section class="wall-feed-section" id="wallFeedSection" aria-label="Support Posts Feed">
      <!-- Filter Bar & Count -->
      <div class="fb-filter-row">
        <!-- Ward Filter Pills (Ward 1 to 11) -->
        <div class="filter-pills fb-filter-bar" role="tablist" aria-label="Filter Posts by Ward">
          <button type="button" class="filter-pill is-active" data-filter="all" role="tab" aria-selected="true" data-i18n="wall.filterAll">सभी 11 वार्ड</button>
          <button type="button" class="filter-pill" data-filter="वार्ड 1" role="tab" aria-selected="false">वार्ड 1</button>
          <button type="button" class="filter-pill" data-filter="वार्ड 2" role="tab" aria-selected="false">वार्ड 2</button>
          <button type="button" class="filter-pill" data-filter="वार्ड 3" role="tab" aria-selected="false">वार्ड 3</button>
          <button type="button" class="filter-pill" data-filter="वार्ड 4" role="tab" aria-selected="false">वार्ड 4</button>
          <button type="button" class="filter-pill" data-filter="वार्ड 5" role="tab" aria-selected="false">वार्ड 5</button>
          <button type="button" class="filter-pill" data-filter="वार्ड 6" role="tab" aria-selected="false">वार्ड 6</button>
          <button type="button" class="filter-pill" data-filter="वार्ड 7" role="tab" aria-selected="false">वार्ड 7</button>
          <button type="button" class="filter-pill" data-filter="वार्ड 8" role="tab" aria-selected="false">वार्ड 8</button>
          <button type="button" class="filter-pill" data-filter="वार्ड 9" role="tab" aria-selected="false">वार्ड 9</button>
          <button type="button" class="filter-pill" data-filter="वार्ड 10" role="tab" aria-selected="false">वार्ड 10</button>
          <button type="button" class="filter-pill" data-filter="वार्ड 11" role="tab" aria-selected="false">वार्ड 11</button>
        </div>
        <span class="fb-count-badge">
          <span data-i18n="wall.countLabel">कुल पोस्ट</span>: <strong id="feedCountNumber">0</strong>
        </span>
      </div>

      <!-- Messages Grid -->
      <div class="wall-grid fb-feed-grid" id="wallGrid" role="feed" aria-label="Support Messages Feed">
        <div class="wall-loading-placeholder">
          <span class="pulse-dot" aria-hidden="true"></span>
          <span>समर्थन पोस्ट लोड हो रही हैं...</span>
        </div>
      </div>
    </section>
  </main>

  <!-- Accessible Lightbox Modal for Supporter Photos -->
  <dialog class="photo-modal" id="photoModal" aria-label="Photo Viewer">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-box">
      <button type="button" class="modal-close" id="modalClose" aria-label="Close" data-i18n-attr="aria-label:meeting.close;title:meeting.close">✕</button>
      <div class="modal-img-wrap">
        <img id="modalImg" alt="समर्थन तस्वीर">
      </div>
      <div class="modal-footer">
        <p class="modal-caption" id="modalCaption">गाँववासी समर्थन तस्वीर</p>
      </div>
    </div>
  </dialog>

  <div data-chrome="footer"></div>

  <script src="js/i18n.js?v=danaram"></script>
  <script src="js/app.js?v=danaram"></script>
</body>
</html>
